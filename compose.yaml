services:
  db:
    image: postgres:17
    container_name: postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_UserName}
      POSTGRES_PASSWORD: ${DB_Password}
      POSTGRES_DB: ${DB_Name}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
