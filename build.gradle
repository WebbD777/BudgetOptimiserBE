plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'co.za.dylanwebb'
version = '0.0.1-SNAPSHOT'
description = 'BudgetOptimiserBE'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(27)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // 🌐 Spring Web: For building REST APIs and running the embedded Tomcat server
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // 🗄️ Spring Data JPA: For connecting Java classes to the database (Hibernate)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // ⚡ H2 Database: Lightweight, in-memory SQL database for fast development
    runtimeOnly 'com.h2database:h2'

    // Testing configuration (keep this if it's already there)
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // For Model
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
}

tasks.named('test') {
    useJUnitPlatform()
}
