spring.application.name=BudgetOptimiserBE
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/BudgetDB
spring.datasource.username=myuser
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# Force Hibernate to update/create schema
spring.jpa.hibernate.ddl-auto=update

# Print generated SQL to verify Hibernate is attempting table creation
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true